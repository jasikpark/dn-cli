[package]
name = "dn-cli"
version = "0.3.0"
edition = "2024"
# `std::fs::File::lock` guards concurrent edits to auth.json.
rust-version = "1.89"
description = "Unofficial CLI for the Defined Networking API"
repository = "https://github.com/jasikpark/dn-cli"
homepage = "https://github.com/jasikpark/dn-cli"
readme = "README.md"
license-file = "LICENSE.md"
keywords = ["defined-networking", "nebula", "vpn", "cli"]
categories = ["command-line-utilities"]

# dn-cli isn't on crates.io, so binstall's quick-install and compile fallbacks
# (both resolve by crates.io name) can never succeed.
[package.metadata.binstall]
disabled-strategies = ["quick-install", "compile"]

[[bin]]
name = "dn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
keyring = "4.2"
rpassword = "7.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
unicode-width = "0.2.2"
ureq = { version = "3.3.0", features = ["json"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "=1.12.0"
tempfile = "=3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
