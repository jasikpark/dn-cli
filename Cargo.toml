[package]
name = "dn-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
unicode-width = "0.2.2"
ureq = { version = "3.3.0", features = ["json"] }
